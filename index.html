<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">
           <img src="./assets/odin-lined.png" alt="Odin logo"> 
           <span>ODIN</span>
        </div>

        <div class="photo-credit">
             Photo by Halie West on Unsplash
        </div>
    </div>

    <div class="main-content">

        <div class="intro">
            <p>
                This is not a real online service! You know you need something
                in your life like this to help you realise your deepest dreams.
                Sign up <em>now</em> to get started.
            </p>

            <p>
                You <em>know</em> you want to.
            </p>

        </div>

        <div class="form-section">
            <h2> Lets do this!</h2>

            <form>
                <div>
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="first-name" required>
                </div>

                <div>
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last-name" required>
                </div>

                <div>
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="phone-number">PHONE NUMBER</label>
                    <input type="tel" id="phone-number" name="phone-number" required>
                </div>

                <div>
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div>
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="password" id="confrim-password" name="confirm-password" required>
                </div>
            </form>

            <button type="submit">Create Account</button>

        </div>

        <div class="account-section">
            <p>Already have an account? <a href="#">Log in</a></p>

        </div>

    </div>
    
</body>
</html>
